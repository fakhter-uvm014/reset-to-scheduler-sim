id: P03
title: Boot fault - wrong initial stack pointer in the vector table
layer: "2 Boot"
description: >
  Word 0 of the vector table (the initial MSP) is 0 instead of the top of
  SRAM. Reset itself works and the reset handler runs, because the startup
  loops never touch the stack. The first push (the "push {r4, lr}" prologue of
  main) writes below address 0, into unmapped memory: a precise BusFault.
  BusFault is disabled at reset, so it escalates to HardFault, and entering
  HardFault needs to push eight words on the same broken stack. On Armv8-M a
  fault while entering or running HardFault (priority -1) generally leads to
  lockup, and the model locks up here.
program: blink
options: {}
faults:
  - {type: wrong_initial_sp, value: 0x00000000}
config:
  seed: 1
  max_cycles: 50000
expected:
  summary: Boot steps up to main_entered pass (vector_table flagged); the first push is a BusFault escalated to HardFault, its entry fails with STKERR, and the core locks up.
  checks:
    - {check: boot_step, step: vector_table, ok: false}
    - {check: boot_step, step: main_entered, ok: true}
    - {check: fault_kind, kind: HardFault}
    - {check: fault_reason_contains, text: "stacking error"}
    - {check: fault_flag, flag: STKERR}
    - {check: fault_escalated_from, kind: BusFault}
    - {check: lockup, value: true}
    - {check: uart_contains, text: "boot ok"}
what_to_look_for: >
  The vector_table boot step is flagged: MSP=0x00000000 is not inside SRAM.
  Execution still reaches main (the startup loops do not use the stack) and
  "boot ok" is printed. The first instruction that touches the stack is
  "push {r4, lr}" in main, which would write 0xFFFFFFF8..0xFFFFFFFF: a BusFault
  PRECISERR with BFAR set to an address inside the pushed range (on the M33
  typically the lowest; the model stores in ascending order and reports
  0xFFFFFFF8), escalated to HardFault because BusFault is not enabled in
  SHCSR (HFSR.FORCED). Entering HardFault must push eight words below
  SP=0: a second fault event "stacking error ... STKERR", then a lockup event
  (the model treats a fault during HardFault entry as lockup, which is what
  Armv8-M generally does at priority -1).
  The last fault record has stacked_frame=null, CFSR=0x00009200 (PRECISERR,
  BFARVALID, STKERR) and sp=msp=0xFFFFFFE0: the decoder tells you the stack
  itself is the problem. Run "r2s fault P03" for the decoded registers.
likely_root_causes:
  - "The linker script's _estack / __stack_top symbol is wrong (0, inside flash, or past the end of SRAM)."
  - "The vector table's first entry was written as a function instead of the stack symbol, or the table is missing the SP word entirely."
  - "The startup file sets MSP by hand from a wrong constant after reset."
  - "The table was placed somewhere else than where the boot ROM / VTOR expects it, so word 0 is really some other data."
how_to_debug:
  - "In GDB: 'monitor reset halt' (the RP2350 halts in the boot ROM), 'hbreak Reset_Handler', 'continue', then 'x/2xw 0x10000000', 'p/x $sp' and 'p/x $pc'. The boot ROM loads MSP and PC from the table: SP must equal word 0 and be inside SRAM (0x2000xxxx), PC must equal word 1 with bit 0 cleared."
  - "Read SCB->HFSR (0xE000ED2C): FORCED set means an escalated fault; SCB->CFSR (0xE000ED28) with STKERR/MSTKERR set means the exception frame could not be pushed."
  - "On a lockup the debugger shows PC=0xEFFFFFFE on ARMv8-M (0xFFFFFFFE on ARMv7-M) and DHCSR.S_LOCKUP=1; do not look for the bug at that address, look at SP."
  - "Fix the symbol, rebuild, and verify with 'arm-none-eabi-objdump -s -j .isr_vector' that word 0 is the SRAM top."
what_this_means: >
  Word 0 of the vector table is loaded straight into MSP by hardware; no code
  checks it. A bad value is harmless until the first push or the first
  exception, which makes the crash appear far from its cause. A fault that
  cannot stack its frame is reported as a HardFault with STKERR, and that
  specific flag is the clue that the stack pointer is wrong.
hidden_symptom: "Board prints 'boot ok' then hangs; the debugger shows the core in lockup with HFSR.FORCED set."
